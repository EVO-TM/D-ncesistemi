<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title id="doc-title">Düşünce Sistemi · Postmodern Rulet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="flash-overlay" id="flash"></div>

  <div id="bg-wrapper" data-configuration="1" data-roundness="1">
    <div class="shape"></div><div class="shape"></div><div class="shape"></div>
    <div class="shape"></div><div class="shape"></div><div class="shape"></div><div class="shape"></div>
  </div>

  <main class="app-container">
    <header class="header">
      <h1 class="app-title" id="app-title">Düşünce <em>Sistemi</em></h1>
      <div class="badge" id="badge-text">Bir konu çevir · <span id="badge-time">15</span> dk araştır · <span id="badge-talk">2</span> dk konuş</div>
    </header>

    <section class="topic-section">
      <div class="label" id="top-label"></div>
      <h2 id="topic-main" class="topic-main">Zihnine Meydan Oku</h2>
      <p id="topic-sub" class="topic-sub"> </p>

      <div id="timer-display" class="timer">15:00</div>
      <div id="question-display" class="question"></div>
    </section>

    <section class="action-section">
      <button class="btn iridescent" id="btn-primary">
        <span class="label-text" id="btn-primary-text">BİR KONU ÜRET</span>
        <span class="drop-shadow"></span>
        <canvas id="canvas"></canvas>
      </button>

      <div id="secondary-actions" class="secondary-actions hidden">
        <button class="btn-ghost" id="btn-respin"><span id="txt-respin">Yeniden Çevir</span></button>
        <button class="btn-ghost" id="btn-reset"><span id="txt-reset">Baştan Başla</span></button>
      </div>

      <p class="footer-text" id="footer-text">Ayakları üzerinde düşünmek isteyenler için.</p>
    </section>
  </main>

  <div class="lang-quick" id="lang-quick">TR</div>

  <div class="settings-btn" id="settings-open" aria-label="Ayarlar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </div>

  <a class="evo-blob-link" href="https://evo-tm.github.io/Portfoy/" target="_blank" rel="noopener noreferrer" title="Portfolyomu ziyaret et" aria-label="Portfolyomu ziyaret et">
    <span class="evo-drop"></span>
    <span class="evo-dot"></span>
  </a>

  <span class="evo-credit">Developed by <span>EVO</span></span>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <h3 class="modal-title" id="settings-title">Sistem Ayarları</h3>

      <div class="input-group">
        <label id="lbl-lang">Dil</label>
        <div class="lang-toggle" id="lang-toggle">
          <button type="button" class="lang-btn active" data-lang="tr">TR</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <div class="input-group">
        <label id="lbl-research">Araştırma Süresi (Dakika)</label>
        <input type="number" id="setting-time" value="15" min="1" max="120">
      </div>
      <div class="input-group">
        <label id="lbl-talk">Konuşma Süresi (Dakika)</label>
        <input type="number" id="setting-talk" value="2" min="1" max="30">
      </div>
      <div class="input-group">
        <label id="lbl-category">Tercih Edilen Kategori</label>
        <select id="setting-category"></select>
        <span class="input-hint" id="lbl-category-hint">Her çevirişte bu alandan bir konu üretilir.</span>
      </div>
      <button class="modal-close" id="settings-close">Kaydet ve Devam Et</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
